name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 把中文文件名复制成 ASCII 名，绕开 wrangler 对非 ASCII 文件名的 bug
      - name: Copy entry to ASCII filename
        run: cp "少年你相信光吗" worker.js

      - name: Create wrangler.toml
        run: |
          cat > wrangler.toml << 'EOF'
          name = "666new"
          main = "worker.js"
          compatibility_date = "2026-01-20"
          keep_vars = true

          kv_namespaces = [ { binding = "KV", id = "1455b9bdf5104ea59453443d71a3dbbf" } ]
          EOF

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
